    - V-FIDELITY-EMPTY-LOB-JOB-shop_price_history
- job_id: JOB-shop_product
  order: 10
  status: READY
  source:
    connection: oracle_source
    schema: SHOP
    table: PRODUCT
    snapshot_binding: ${run_scn}
    query: "SELECT\n    CAST(\"product\".\"PRODUCT_ID\" AS NUMERIC(10, 0)) AS \"product_id\"\
      ,\n    CAST(\"product\".\"NAME\" AS VARCHAR(120)) AS \"product_name\",\n   \
      \ CAST(\"category\".\"TITLE\" AS VARCHAR(80)) AS \"category_title\",\n    CAST(\"\
      AMOUNT\" AS NUMERIC(12, 2)) AS \"amount\"\n  FROM \"SHOP\".\"PRODUCT\" AS OF\
      \ SCN ${run_scn} \"product\"\n  INNER JOIN \"SHOP\".\"CATEGORY\" AS OF SCN ${run_scn}\
      \ \"category\"\n    ON \"product\".\"CATEGORY_ID\" = \"category\".\"CATEGORY_ID\""
  target:
    connection: postgresql_target
    schema: shop
    table: product_catalogue
  primary_keys: []
  validation_strategy:
    is_complex_transformation: true
    native_dvt_schema: true
    native_dvt_row: false
    dvt_custom_query: true
  contract_coverage:
