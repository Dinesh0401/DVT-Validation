- job_id: JOB-shop_price_history
  order: 9
  status: READY
  source:
    connection: oracle_source
    schema: SHOP
    table: PRICE_HISTORY
    snapshot_binding: ${run_scn}
    query: "SELECT\n    \"d0\".\"CHANGED_AT\" AS \"changed_at\",\n    CAST(\"d0\"\
      .\"AMOUNT\" AS NUMERIC(12, 2)) AS \"amount\"\n  FROM (\n    SELECT\n      *\n\
      \    FROM (\n      SELECT\n        p.*,\n        ROW_NUMBER() OVER (PARTITION\
      \ BY PRODUCT_ID ORDER BY CHANGED_AT DESC) AS rn\n      FROM SHOP.PRICE_HISTORY\
      \ AS OF SCN ${run_scn} p\n    )\n    WHERE\n      rn = 1\n  ) \"d0\""
  target:
    connection: postgresql_target
    schema: shop
    table: price_history
  primary_keys: []
  validation_strategy:
    is_complex_transformation: true
    native_dvt_schema: true
    native_dvt_row: false
