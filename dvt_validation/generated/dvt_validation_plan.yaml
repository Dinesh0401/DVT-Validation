metadata:
  title: Stage-1 Pre-migration DVT Validation Plan (Oracle -> PostgreSQL)
  source_engine: Oracle
  target_engine: PostgreSQL
  generated_by: Stage-1 Generic Preflight Pipeline
  convention:
    zero_rows_means_pass: true
    nonzero_rows_means_fail: true
    acquisition: snapshot
    snapshot_binding: ${run_scn}
connections:
  source:
    name: oracle_source
    type: Oracle
    host: ${ORACLE_HOST}
    port: ${ORACLE_PORT:-1521}
    database: ${ORACLE_DATABASE}
    user: ${ORACLE_DB_USER}
    password: ${ORACLE_DB_PASSWORD}
  target:
    name: postgresql_target
    type: Postgres
    host: ${POSTGRESQL_HOST}
    port: ${POSTGRESQL_PORT:-5432}
    database: ${POSTGRESQL_DATABASE}
    user: ${POSTGRESQL_DB_USER}
    password: ${POSTGRESQL_DB_PASSWORD}
jobs:
- job_id: JOB-shop_audit_event
  order: 1
  status: READY
  source:
    connection: oracle_source
    schema: SHOP
    table: AUDIT_EVENT
    snapshot_binding: ${run_scn}
    query: "SELECT\n    \"EVENT_ID\" AS \"event_id\",\n    CAST(\"AMOUNT\" AS NUMERIC(12,\
      \ 2)) AS \"amount\"\n  FROM \"SHOP\".\"AUDIT_EVENT\" AS OF SCN ${run_scn} \"\
      t0\""
  target:
    connection: postgresql_target
    schema: shop
    table: audit_event
  primary_keys:
  - event_id
  validation_strategy:
    is_complex_transformation: false
    native_dvt_schema: true
    native_dvt_row: true
    dvt_custom_query: false
  contract_coverage:
    total_checks: 11
    checks_with_sql: 5
    runtime_only_checks: 6
    sql_checks_summary:
    - V-ROWCOUNT-JOB-shop_audit_event
    - V-DELIVERY-JOB-shop_audit_event
    - V-FIDELITY-JOB-shop_audit_event
    - V-FIDELITY-NULL-JOB-shop_audit_event-event_id
    - V-FIDELITY-EMPTY-LOB-JOB-shop_audit_event
- job_id: JOB-shop_branch
  order: 2
  status: READY
  source:
    connection: oracle_source
    schema: SHOP
    table: BRANCH
    snapshot_binding: ${run_scn}
    query: "SELECT\n    CAST(\"AMOUNT\" AS NUMERIC(12, 2)) AS \"amount\",\n    TRIM(\"\
      CODE\") AS \"code\"\n  FROM \"SHOP\".\"BRANCH\" AS OF SCN ${run_scn} \"t0\""
  target:
    connection: postgresql_target
    schema: shop
    table: branch
  primary_keys: []
  validation_strategy:
    is_complex_transformation: false
    native_dvt_schema: true
    native_dvt_row: true
