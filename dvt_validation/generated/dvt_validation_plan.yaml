    - V-ROWCOUNT-JOB-shop_product
    - V-FIDELITY-EMPTY-LOB-JOB-shop_product
- job_id: JOB-shop_stock
  order: 11
  status: READY
  source:
    connection: oracle_source
    schema: SHOP
    table: STOCK
    snapshot_binding: ${run_scn}
    query: "SELECT\n    CAST(\"AMOUNT\" AS NUMERIC(12, 2)) AS \"amount\",\n    \"\
      PRODUCT_ID\" AS \"product_id\",\n    CAST(SUM(CASE WHEN \"WAREHOUSE\" = 'NORTH'\
      \ THEN \"QTY\" END) AS NUMERIC(10, 0)) AS \"qty_north\",\n    CAST(SUM(CASE\
      \ WHEN \"WAREHOUSE\" = 'SOUTH' THEN \"QTY\" END) AS NUMERIC(10, 0)) AS \"qty_south\"\
      ,\n    SUM(CASE WHEN NOT \"WAREHOUSE\" IN ('NORTH', 'SOUTH') THEN 1 ELSE 0 END)\
      \ AS \"__q_stock-by-product_unlisted\"\n  FROM \"SHOP\".\"STOCK\" AS OF SCN\
      \ ${run_scn} \"t0\"\n  GROUP BY\n    \"PRODUCT_ID\""
  target:
    connection: postgresql_target
    schema: shop
    table: stock_by_product
  primary_keys:
  - product_id
  validation_strategy:
    is_complex_transformation: true
    native_dvt_schema: true
    native_dvt_row: false
    dvt_custom_query: true
  contract_coverage:
    total_checks: 12
    checks_with_sql: 6
    runtime_only_checks: 6
    sql_checks_summary:
    - V-ROWCOUNT-JOB-shop_stock
    - V-QUARANTINE-JOB-shop_stock
    - V-DELIVERY-JOB-shop_stock
    - V-FIDELITY-NULL-JOB-shop_stock-product_id
    - V-FIDELITY-EMPTY-LOB-JOB-shop_stock
    - V-QUARANTINE-COLUMN-JOB-shop_stock-__q_stock-by-product_unlisted
