# DVT validation config — generated by Stage-1 preflight
# Do not edit by hand; re-run scripts/run_preflight.py

sources:
  oracle:
    type: oracle
    connection: ${ORACLE_JDBC_URL}
    user: ${ORACLE_DB_USER}
    password: ${ORACLE_DB_PASSWORD}
  postgresql:
    type: postgresql
    connection: ${PG_JDBC_URL}
    user: ${PG_DB_USER}
    password: ${PG_DB_PASSWORD}

convention:
  zero_rows_means_pass: true
  nonzero_rows_means_fail: true

validations:
  - name: JOB-shop_audit_event
    source: ""shop"."audit_event""
    target: ""shop"."audit_event""
    run_scn: ${RUN_RECORD_ORACLE_SCN}
    checks:
      - id: V-ROWCOUNT-JOB-shop_audit_event
        type: row-count-exact
        sql: "SELECT   1 WHERE   (     SELECT       COUNT(*)     FROM __SOURCE__shop_audit_event   ) <> (     SELECT       COUNT(*)     FROM __TARGET__shop_audit_event   )"
      - id: V-DELIVERY-JOB-shop_audit_event
        type: column-delivery
        sql: "SELECT   * FROM (   SELECT     'amount' AS "column_name"   FROM __SOURCE__shop_audit_event AS s   JOIN __TARGET__shop_audit_event AS t     USING ("event_id")   WHERE     s."amount" IS DISTINCT FROM t."amount" ) LIMIT 20"
      - id: V-FIDELITY-JOB-shop_audit_event
        type: passthrough-fidelity
        sql: "SELECT   * FROM (   SELECT     'event_id' AS "column_name"   FROM __RAW__shop_audit_event AS r   JOIN __TARGET__shop_audit_event AS t     USING ("event_id")   WHERE     r."EVENT_ID" IS DISTINCT FROM t."event_id" ) LIMIT 20"
      - id: V-FIDELITY-NULL-JOB-shop_audit_event-event_id
        type: not-null-preserved
        sql: "SELECT   1 FROM __TARGET__shop_audit_event WHERE   "event_id" IS NULL LIMIT 1"
      - id: V-FIDELITY-EMPTY-LOB-JOB-shop_audit_event
        type: empty-lob-preserved
        sql: "SELECT   1 FROM __TARGET__shop_audit_event WHERE   "event_id" = '' LIMIT 1"

  - name: JOB-shop_branch
    source: ""shop"."branch""
    target: ""shop"."branch""
    run_scn: ${RUN_RECORD_ORACLE_SCN}
    checks:
      - id: V-ROWCOUNT-JOB-shop_branch
        type: row-count-exact
        sql: "SELECT   1 WHERE   (     SELECT       COUNT(*)     FROM __SOURCE__shop_branch   ) <> (     SELECT       COUNT(*)     FROM __TARGET__shop_branch   )"
      - id: V-FIDELITY-EMPTY-LOB-JOB-shop_branch
        type: empty-lob-preserved
        sql: "SELECT   1 FROM __TARGET__shop_branch WHERE   "code" = '' LIMIT 1"

  - name: JOB-shop_customer
    source: ""shop"."client""
    target: ""shop"."client""
    run_scn: ${RUN_RECORD_ORACLE_SCN}
    checks:
      - id: V-ROWCOUNT-JOB-shop_customer
        type: row-count-exact
        sql: "SELECT   1 WHERE   (     SELECT       COUNT(*)     FROM __SOURCE__shop_client   ) <> (     SELECT       COUNT(*)     FROM __TARGET__shop_client   )"
      - id: V-FIDELITY-NULL-JOB-shop_customer-created_on
        type: not-null-preserved
        sql: "SELECT   1 FROM __TARGET__shop_client WHERE   "created_on" IS NULL LIMIT 1"
      - id: V-FIDELITY-EMPTY-LOB-JOB-shop_customer
        type: empty-lob-preserved
        sql: "SELECT   1 FROM __TARGET__shop_client WHERE   "first_name" = ''   OR "last_name" = ''   OR "mobile" = ''   OR "landline" = ''   OR "vip" = ''   OR "full_address" = ''   OR "country_code" = ''   OR "email" = ''   OR "status_code" = ''   OR "full_name" = ''   OR "contact_phone" = ''   OR "status_label" = ''   OR "street" = ''   OR "city" = '' LIMIT 1"
      - id: V-COLUMNSPLIT-customer-table
        type: split-extra-parts
        sql: "SELECT   1 FROM __TARGET__shop_client WHERE   NOT "__q_customer-table_extra_parts" IS NULL LIMIT 1"

  - name: JOB-shop_order_summary
    source: ""shop"."order_summary""
    target: ""shop"."order_summary""
    run_scn: ${RUN_RECORD_ORACLE_SCN}
    checks:
      - id: V-ROWCOUNT-JOB-shop_order_summary
        type: row-count-exact
        sql: "SELECT   1 WHERE   (     SELECT       COUNT(*)     FROM __SOURCE__shop_order_summary   ) <> (     SELECT       COUNT(*)     FROM __TARGET__shop_order_summary   )"

  - name: JOB-shop_orders
    source: ""shop"."orders""
    target: ""shop"."orders""
    run_scn: ${RUN_RECORD_ORACLE_SCN}
    checks:
      - id: V-ROWCOUNT-JOB-shop_orders
        type: row-count-exact
        sql: "SELECT   1 WHERE   (     SELECT       COUNT(*)     FROM __SOURCE__shop_orders   ) <> (     SELECT       COUNT(*)     FROM __TARGET__shop_orders   )"
      - id: V-STRICT-0-AGGREGATE-JOB-shop_orders
        type: aggregate-match
        sql: "SELECT   1 WHERE   ABS(     (       SELECT         SUM(CAST("__aggregate_column__" AS DOUBLE))       FROM __TARGET__shop_orders     ) - (       SELECT         SUM(CAST("__aggregate_column__" AS DOUBLE))       FROM __SOURCE__shop_orders     )   ) > 0.01"
      - id: V-FIDELITY-EMPTY-LOB-JOB-shop_orders
        type: empty-lob-preserved
        sql: "SELECT   1 FROM __TARGET__shop_orders WHERE   "narrative" = ''   OR "order_date" = ''   OR "shop.branch" = ''   OR "branch_code" = ''   OR "currency" = ''   OR "ship_date" = ''   OR "priority" = ''   OR "tenant_id" = ''   OR "branch_name" = '' LIMIT 1"

  - name: JOB-shop_orders_2023--merged
    source: ""shop"."orders_history""
    target: ""shop"."orders_history""
    run_scn: ${RUN_RECORD_ORACLE_SCN}
    checks:
      - id: V-ROWCOUNT-JOB-shop_orders_2023--merged
        type: row-count-exact
        sql: "SELECT   1 WHERE   (     SELECT       COUNT(*)     FROM __SOURCE__shop_orders_history   ) <> (     SELECT       COUNT(*)     FROM __TARGET__shop_orders_history   )"

  - name: JOB-shop_party--company
    source: ""shop"."party_company""
    target: ""shop"."party_company""
    run_scn: ${RUN_RECORD_ORACLE_SCN}
    checks:
      - id: V-ROWCOUNT-JOB-shop_party--company
        type: row-count-exact
        sql: "SELECT   1 WHERE   (     SELECT       COUNT(*)     FROM __SOURCE__shop_party_company   ) <> (     SELECT       COUNT(*)     FROM __TARGET__shop_party_company   )"

  - name: JOB-shop_party--person
    source: ""shop"."party_person""
    target: ""shop"."party_person""
    run_scn: ${RUN_RECORD_ORACLE_SCN}
    checks:
      - id: V-ROWCOUNT-JOB-shop_party--person
        type: row-count-exact
        sql: "SELECT   1 WHERE   (     SELECT       COUNT(*)     FROM __SOURCE__shop_party_person   ) <> (     SELECT       COUNT(*)     FROM __TARGET__shop_party_person   )"

  - name: JOB-shop_price_history
    source: ""shop"."price_history""
    target: ""shop"."price_history""
    run_scn: ${RUN_RECORD_ORACLE_SCN}
    checks:
      - id: V-ROWCOUNT-JOB-shop_price_history
        type: row-count-exact
        sql: "SELECT   1 WHERE   (     SELECT       COUNT(*)     FROM __SOURCE__shop_price_history   ) <> (     SELECT       COUNT(*)     FROM __TARGET__shop_price_history   )"
      - id: V-FIDELITY-EMPTY-LOB-JOB-shop_price_history
        type: empty-lob-preserved
        sql: "SELECT   1 FROM __TARGET__shop_price_history WHERE   "changed_at" = '' LIMIT 1"

  - name: JOB-shop_product
    source: ""shop"."product_catalogue""
    target: ""shop"."product_catalogue""
    run_scn: ${RUN_RECORD_ORACLE_SCN}
    checks:
      - id: V-ROWCOUNT-JOB-shop_product
        type: row-count-exact
        sql: "SELECT   1 WHERE   (     SELECT       COUNT(*)     FROM __SOURCE__shop_product_catalogue   ) <> (     SELECT       COUNT(*)     FROM __TARGET__shop_product_catalogue   )"
      - id: V-FIDELITY-EMPTY-LOB-JOB-shop_product
        type: empty-lob-preserved
        sql: "SELECT   1 FROM __TARGET__shop_product_catalogue WHERE   "product_name" = '' OR "category_title" = '' LIMIT 1"

  - name: JOB-shop_stock
    source: ""shop"."stock_by_product""
    target: ""shop"."stock_by_product""
    run_scn: ${RUN_RECORD_ORACLE_SCN}
    checks:
      - id: V-ROWCOUNT-JOB-shop_stock
        type: row-count-exact
        sql: "SELECT   1 WHERE   (     SELECT       COUNT(*)     FROM __SOURCE__shop_stock_by_product   ) <> (     SELECT       COUNT(*)     FROM __TARGET__shop_stock_by_product   )"
      - id: V-QUARANTINE-JOB-shop_stock
        type: quarantine-empty
        sql: "SELECT   1 FROM __QUARANTINE__shop_stock_by_product LIMIT 1"
      - id: V-DELIVERY-JOB-shop_stock
        type: column-delivery
        sql: "SELECT   * FROM (   SELECT     'amount' AS "column_name"   FROM __SOURCE__shop_stock_by_product AS s   JOIN __TARGET__shop_stock_by_product AS t     USING ("product_id")   WHERE     s."amount" IS DISTINCT FROM t."amount"   UNION ALL   SELECT     'qty_north' AS "column_name"   FROM __SOURCE__shop_stock_by_product AS s   JOIN __TARGET__shop_stock_by_product AS t     USING ("product_id")   WHERE     s."qty_north" IS DISTINCT FROM t."qty_north"   UNION ALL   SELECT     'qty_south' AS "column_name"   FROM __SOURCE__shop_stock_by_product AS s   JOIN __TARGET__shop_stock_by_product AS t     USING ("product_id")   WHERE     s."qty_south" IS DISTINCT FROM t."qty_south"   UNION ALL   SELECT     '__q_stock-by-product_unlisted' AS "column_name"   FROM __SOURCE__shop_stock_by_product AS s   JOIN __TARGET__shop_stock_by_product AS t     USING ("product_id")   WHERE     s."__q_stock-by-product_unlisted" IS DISTINCT FROM t."__q_stock-by-product_unlisted" ) LIMIT 20"
      - id: V-FIDELITY-NULL-JOB-shop_stock-product_id
        type: not-null-preserved
        sql: "SELECT   1 FROM __TARGET__shop_stock_by_product WHERE   "product_id" IS NULL LIMIT 1"
      - id: V-FIDELITY-EMPTY-LOB-JOB-shop_stock
        type: empty-lob-preserved
        sql: "SELECT   1 FROM __TARGET__shop_stock_by_product WHERE   "product_id" = '' LIMIT 1"
      - id: V-QUARANTINE-COLUMN-JOB-shop_stock-__q_stock-by-product_unlisted
        type: quarantine-sentinel
        sql: "SELECT   1 FROM __TARGET__shop_stock_by_product WHERE   NOT "__q_stock-by-product_unlisted" IS NULL LIMIT 1"
